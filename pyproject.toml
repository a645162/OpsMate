[project]
name = "opsassistant"
version = "0.1.0"
description = "运维助手（OpsAssistant）—— 本地服务器运维台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "landui-sdk>=0.1.0",
]

[project.scripts]
ops = "opsassistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsassistant"]

# 蓝队云 SDK 还没发布到 PyPI，本地开发直接指向隔壁仓库。
# 以后发布了就删掉这两行、改成普通版本依赖。
[tool.uv.sources]
landui-sdk = { path = "../../LanduiSDK", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
